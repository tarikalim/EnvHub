name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: envhub-macos-arm64.zip
          - os: ubuntu-latest
            asset: envhub-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev

      - run: cargo build --release

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          ./tools/install.sh dist/envhub.app
          ditto -c -k --keepParent dist/envhub.app "${{ matrix.asset }}"

      - name: Package (Linux binary)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C target/release envhub

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
